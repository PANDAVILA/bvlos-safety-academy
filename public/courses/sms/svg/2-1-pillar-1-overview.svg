ly="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="938" dy="0">Accountable Executive (cannot delegate)</tspan></text><circle cx="922" cy="300" r="5" fill="#F59E0B" stroke="none" stroke-width="2"/><text x="938" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="938" dy="0">Safety Manager, Chief Pilot, RPIC, VO</tspan></text><rect x="90" y="640" width="630" height="140" rx="12" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><rect x="90" y="640" width="12" height="140" rx="0" fill="#00A8E8" stroke="none" stroke-width="2"/><text x="126" y="686" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="126" dy="0">Emergency response planning</tspan></text><circle cx="132" cy="716" r="5" fill="#F59E0B" stroke="none" stroke-width="2"/><text x="148" y="722" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="148" dy="0">Fly-away, battery fire, collision</tspan></text><circle cx="132" cy="750" r="5" fill="#F59E0B" stroke="none" stroke-width="2"/><text x="148" y="756" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="148" dy="0">Notification tree and drills</tspan></text><rect x="880" y="640" width="630" height="140" rx="12" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><rect x="880" y="640" width="12" height="140" rx="0" fill="#00A8E8" stroke="none" stroke-width="2"/><text x="916" y="686" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="916" dy="0">Documentation &amp; records</tspan></text><circle cx="922" cy="716" r="5" fill="#F59E0B" stroke="none" stroke-width="2"/><text x="938" y="722" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="938" dy="0">SMS Manual, SRM records</tspan></text><circle cx="922" cy="750" r="5" fill="#F59E0B" stroke="none" stroke-width="2"/><text x="938" y="756" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="938" dy="0">Retention rules under §5.97</tspan></text><rect x="610" y="400" width="380" height="160" rx="16" fill="#0B1F3A" stroke="none" stroke-width="0"/><text x="800" y="458" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2"><tspan x="800" dy="0">SAFETY POLICY</tspan></text><text x="800" y="494" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2"><tspan x="800" dy="0">STATEMENT</tspan></text><text x="800" y="530" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#BFD3EA" text-anchor="middle"><tspan x="800" dy="0">Signed by the Accountable Executive</tspan></text><text x="800" y="592" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#64748B" text-anchor="middle"><tspan x="800" dy="0">Communicated to everyone</tspan></text><text x="800" y="616" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#64748B" text-anchor="middle"><tspan x="800" dy="0">and reviewed regularly</tspan></text>
