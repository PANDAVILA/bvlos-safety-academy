<text x="70" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">Emergency Response Plan: sequence and notifications</tspan></text>
<text x="70" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">Priorities first, then the people who need to know.</tspan></text>
<polygon points="70.0,190.0 410.0,190.0 450.0,260.0 410.0,330.0 70.0,330.0" fill="#0B1F3A" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="150" cy="240" r="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="150" y="249" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B1F3A" text-anchor="middle"><tspan x="150" dy="0">1</tspan></text><text x="190" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="190" dy="0">AVIATE</tspan></text><text x="190" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="190" dy="0">Fly the aircraft.</tspan></text><text x="190" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="190" dy="0">Verify failsafe: RTH, hover, land.</tspan></text><polygon points="435.0,190.0 775.0,190.0 815.0,260.0 775.0,330.0 435.0,330.0 475.0,260.0" fill="#F59E0B" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="515" cy="240" r="22" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="515" y="249" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#F59E0B" text-anchor="middle"><tspan x="515" dy="0">2</tspan></text><text x="555" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#0B1F3A" text-anchor="start"><tspan x="555" dy="0">NAVIGATE</tspan></text><text x="555" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="555" dy="0">Track last known position,</tspan></text><text x="555" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="555" dy="0">heading and remaining energy.</tspan></text><polygon points="800.0,190.0 1140.0,190.0 1180.0,260.0 1140.0,330.0 800.0,330.0 840.0,260.0" fill="#0B1F3A" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="880" cy="240" r="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="880" y="249" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B1F3A" text-anchor="middle"><tspan x="880" dy="0">3</tspan></text><text x="920" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="920" dy="0">COMMUNICATE</tspan></text><text x="920" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="920" dy="0">Alert crew, ATC and</tspan></text><text x="920" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="920" dy="0">the notification tree.</tspan></text><polygon points="1165.0,190.0 1505.0,190.0 1545.0,260.0 1505.0,330.0 1165.0,330.0 1205.0,260.0" fill="#F59E0B" stroke="none" stroke-width="2" stroke-linejoin="round"/><circle cx="1245" cy="240" r="22" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="1245" y="249" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#F59E0B" text-anchor="middle"><tspan x="1245" dy="0">4</tspan></text><text x="1285" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#0B1F3A" text-anchor="start"><tspan x="1285" dy="0">MITIGATE</tspan></text><text x="1285" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="1285" dy="0">Parachute / FTS, protect people,</tspan></text><text x="1285" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="1285" dy="0">suppress fire, preserve evidence.</tspan></text><line x1="70" y1="375" x2="1530" y2="375" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/><text x="70" y="412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#64748B" text-anchor="start" letter-spacing="2"><tspan x="70" dy="0">NOTIFICATION TREE</tspan></text><text x="340" y="440" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#64748B" text-anchor="start" letter-spacing="2"><tspan x="340" dy="0">IMMEDIATELY</tspan></text><text x="920" y="440" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#64748B" text-anchor="start" letter-spacing="2"><tspan x="920" dy="0">THEN REPORT, AS REQUIRED</tspan></text><circle cx="200" cy="640" r="90" fill="#EF4444" stroke="none" stroke-width="2"/><polygon points="200.0,580.0 242.0,658.0 158.0,658.0" fill="#FFFFFF" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="200" y="650" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#EF4444" text-anchor="middle"><tspan x="200" dy="0">!</tspan></text><text x="200" y="700" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1"><tspan x="200" dy="0">EMERGENCY</tspan></text><path d="M290,640 C320,640 300,505 340,505" fill="none" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="453" width="450" height="104" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="3"/><text x="360" y="493" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="360" dy="0">Emergency services (911)</tspan></text><text x="360" y="521" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="360" dy="0">If anyone is hurt or a fire threatens</tspan><tspan x="360" dy="18.75">people, brush or structures</tspan></text><path d="M290,640 C320,640 300,640 340,640" fill="none" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="588" width="450" height="104" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="3"/><text x="360" y="628" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="360" dy="0">Air Traffic Control</tspan></text><text x="360" y="656" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="360" dy="0">If the aircraft threatens or</tspan><tspan x="360" dy="18.75">enters controlled airspace</tspan></text><path d="M290,640 C320,640 300,775 340,775" fill="none" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="723" width="450" height="104" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="3"/><text x="360" y="763" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="360" dy="0">Accountable Executive + Safety Manager</tspan></text><text x="360" y="791" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="360" dy="0">Then follow the SMS reporting process</tspan></text><path d="M810,505 L830,505 L830,775 L810,775" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="830" y1="640" x2="880" y2="640" stroke="#64748B" stroke-width="3" stroke-linecap="round"/><path d="M880,640 C900,640 880,560 920,560" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="920" y="505" width="610" height="110" rx="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="3"/><text x="940" y="548" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="940" dy="0">NTSB</tspan></text><text x="940" y="578" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="940" dy="0">Immediately if the event meets the</tspan><tspan x="940" dy="20.0">49 CFR Part 830 accident definition</tspan></text><path d="M880,640 C900,640 880,720 920,720" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="920" y="665" width="610" height="110" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/><text x="940" y="708" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="940" dy="0">FAA</tspan></text><text x="940" y="738" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="940" dy="0">Part 107: within 10 calendar days (§107.9)</tspan><tspan x="940" dy="20.0">for serious injury, LOC or damage over $500</tspan></text>
