<rect x="0" y="0" width="1600" height="10" rx="0" fill="#0B1F3A" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="160" height="10" rx="0" fill="#F59E0B" stroke="none" stroke-width="2"/>
<text x="70" y="62" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#64748B" text-anchor="start" letter-spacing="2"><tspan x="70" dy="0">BVLOS SAFETY ACADEMY  ·  BVLOS RISK ASSESSMENT AND SAFETY CASE</tspan></text>
<text x="70" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">Regulatory pathways for BVLOS</tspan></text>
<text x="70" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">Same thinking, different paperwork</tspan></text>
<rect x="70" y="190" width="700" height="620" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><rect x="830" y="190" width="700" height="620" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><rect x="70" y="190" width="700" height="56" rx="12" fill="#0B1F3A" stroke="none" stroke-width="0"/><rect x="70" y="220" width="700" height="26" rx="0" fill="#0B1F3A" stroke="none" stroke-width="2"/><rect x="830" y="190" width="700" height="56" rx="12" fill="#0B1F3A" stroke="none" stroke-width="0"/><rect x="830" y="220" width="700" height="26" rx="0" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="420" y="227" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3"><tspan x="420" dy="0">UNITED STATES</tspan></text><text x="1180" y="227" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3"><tspan x="1180" dy="0">EUROPEAN UNION (EASA)</tspan></text><rect x="100" y="290" width="640" height="150" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><rect x="100" y="290" width="14" height="150" rx="4" fill="#00A8E8" stroke="none" stroke-width="0"/><text x="140" y="342" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="140" dy="0">Part 107 waiver</tspan></text><text x="140" y="380" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="140" dy="0">Request a waiver of the VLOS rule (§107.31) in the</tspan><tspan x="140" dy="22.5">FAA Aviation Safety Hub</tspan></text><rect x="100" y="460" width="640" height="150" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><rect x="100" y="460" width="14" height="150" rx="4" fill="#00A8E8" stroke="none" stroke-width="0"/><text x="140" y="512" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="140" dy="0">CONOPS + hazard analysis</tspan></text><text x="140" y="550" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="140" dy="0">FAA does not require SORA, but expects severity and</tspan><tspan x="140" dy="22.5">likelihood before and after</tspan></text><rect x="100" y="630" width="640" height="150" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/><rect x="100" y="630" width="14" height="150" rx="4" fill="#F59E0B" stroke="none" stroke-width="0"/><text x="140" y="682" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="140" dy="0">Proposed Part 108</tspan></text><text x="140" y="720" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="140" dy="0">Permits and certificates. Proposed August 2025, not</tspan><tspan x="140" dy="22.5">final when this was written</tspan></text><rect x="860" y="290" width="640" height="150" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><rect x="860" y="290" width="14" height="150" rx="4" fill="#00A8E8" stroke="none" stroke-width="0"/><text x="900" y="342" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="900" dy="0">STS-02</tspan></text><text x="900" y="380" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="900" dy="0">Declaration for BVLOS over a controlled ground area</tspan><tspan x="900" dy="22.5">in sparsely populated areas</tspan></text><rect x="860" y="460" width="640" height="150" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><rect x="860" y="460" width="14" height="150" rx="4" fill="#00A8E8" stroke="none" stroke-width="0"/><text x="900" y="512" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="900" dy="0">PDRA (S-01, S-02, G-01, G-02, G-03)</tspan></text><text x="900" y="550" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="900" dy="0">Risk assessment already done by EASA. You write the</tspan><tspan x="900" dy="22.5">Operations Manual</tspan></text><rect x="860" y="630" width="640" height="150" rx="10" fill="#FFFFFF" stroke="#173558" stroke-width="3"/><rect x="860" y="630" width="14" height="150" rx="4" fill="#173558" stroke="none" stroke-width="0"/><text x="900" y="682" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="900" dy="0">SORA 2.5</tspan></text><text x="900" y="720" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="900" dy="0">Full assessment when no scenario matches.</tspan><tspan x="900" dy="22.5">Authorization from the national authority</tspan></text>
<line x1="70" y1="852" x2="1530" y2="852" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
<text x="70" y="880" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#64748B" text-anchor="start" letter-spacing="1.5"><tspan x="70" dy="0">1.2  ·  RISK ASSESSMENT AND SAFETY CASE</tspan></text>
<text x="1530" y="880" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="end"><tspan x="1530" dy="0">Check the current text before relying on it.</tspan></text>
