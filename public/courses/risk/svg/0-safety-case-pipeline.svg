50" y1="430" x2="1130" y2="350" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round" marker-end="url(#aN)"/><line x1="1050" y1="450" x2="1130" y2="530" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round" marker-end="url(#aN)"/><rect x="1130" y="680" width="400" height="110" rx="10" fill="#10B981" stroke="none" stroke-width="2"/><text x="1330.0" y="731.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1330.0" dy="0">10  Safety case package</tspan></text><text x="1330.0" y="759.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.85"><tspan x="1330.0" dy="0">evidence, traceability, services</tspan></text><line x1="1330" y1="400" x2="1330" y2="410" stroke="#0B1F3A" stroke-width="1" stroke-linecap="round"/><line x1="1330" y1="580" x2="1330" y2="680" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round" marker-end="url(#aN)"/><line x1="1330" y1="400" x2="1330" y2="480" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round" marker-end="url(#aN)"/><text x="70" y="740" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">The same ground-and-air logic feeds an EASA authorization and an FAA waiver.</tspan></text><text x="70" y="775" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">SORA 2.5 steps are numbered as in the JARUS Main Body.</tspan></text>
