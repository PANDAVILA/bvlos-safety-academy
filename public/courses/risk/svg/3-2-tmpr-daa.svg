er, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="791.0" dy="0">Sensor</tspan></text><line x1="862" y1="280" x2="886" y2="280" stroke="#00A8E8" stroke-width="4" stroke-linecap="round" marker-end="url(#aC)"/><rect x="886" y="235" width="142" height="90" rx="10" fill="#173558" stroke="none" stroke-width="2"/><text x="957.0" y="286.65" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="957.0" dy="0">Alert</tspan></text><line x1="1028" y1="280" x2="1052" y2="280" stroke="#00A8E8" stroke-width="4" stroke-linecap="round" marker-end="url(#aC)"/><rect x="1052" y="235" width="142" height="90" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="1123.0" y="286.65" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1123.0" dy="0">Decision</tspan></text><line x1="1194" y1="280" x2="1218" y2="280" stroke="#00A8E8" stroke-width="4" stroke-linecap="round" marker-end="url(#aC)"/><rect x="1218" y="235" width="142" height="90" rx="10" fill="#173558" stroke="none" stroke-width="2"/><text x="1289.0" y="286.65" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1289.0" dy="0">Command</tspan></text><line x1="1360" y1="280" x2="1384" y2="280" stroke="#00A8E8" stroke-width="4" stroke-linecap="round" marker-end="url(#aC)"/><rect x="1384" y="235" width="142" height="90" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="1455.0" y="286.65" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1455.0" dy="0">Manoeuvre</tspan></text><text x="720" y="372" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="720" dy="0">Test the whole chain, not only the sensor.</tspan></text><rect x="720" y="410" width="380" height="200" rx="12" fill="#F1F5F9" stroke="none" stroke-width="0"/><text x="740" y="445" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="740" dy="0">Cooperative traffic</tspan></text><text x="740" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="740" dy="0">ADS-B and transponder</tspan><tspan x="740" dy="23.400000000000002">equipped aircraft</tspan></text><rect x="1130" y="410" width="400" height="200" rx="12" fill="#FDE8E8" stroke="none" stroke-width="0"/><text x="1150" y="445" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#EF4444" text-anchor="start"><tspan x="1150" dy="0">Non-cooperative traffic</tspan></text><text x="1150" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="1150" dy="0">gliders, paragliders, many</tspan><tspan x="1150" dy="23.400000000000002">light aircraft and drones</tspan></text><text x="1150" y="560" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#EF4444" text-anchor="start"><tspan x="1150" dy="0">Assess separately: an average</tspan></text><text x="1150" y="582" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#EF4444" text-anchor="start"><tspan x="1150" dy="0">can hide poor results</tspan></text><rect x="720" y="650" width="810" height="150" rx="12" fill="#FEF3D6" stroke="#F59E0B" stroke-width="2"/><text x="745" y="686" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7791F" text-anchor="start"><tspan x="745" dy="0">Observer example</tspan></text><text x="745" y="720" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="745" dy="0">30 s at 120 kt = 1 NM. With 1.5 NM detection, max distance is about 0.5 NM.</tspan></text><text x="745" y="752" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="745" dy="0">FAA reference detection: about 1.5 SM head-on, 2 to 2.5 SM on tangential tracks</tspan></text>
