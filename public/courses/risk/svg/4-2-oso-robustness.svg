<text x="70" y="205" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="2"><tspan x="70" dy="0">OSO AREAS</tspan></text><rect x="70" y="235" width="640" height="76" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><rect x="70" y="235" width="14" height="76" rx="4" fill="#00A8E8" stroke="none" stroke-width="0"/><text x="105" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="105" dy="0">Technical issue with the UAS</tspan></text><rect x="70" y="327" width="640" height="76" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><rect x="70" y="327" width="14" height="76" rx="4" fill="#00A8E8" stroke="none" stroke-width="0"/><text x="105" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="105" dy="0">Deterioration of external systems</tspan></text><rect x="70" y="419" width="640" height="76" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><rect x="70" y="419" width="14" height="76" rx="4" fill="#00A8E8" stroke="none" stroke-width="0"/><text x="105" y="466" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="105" dy="0">Human error</tspan></text><rect x="70" y="511" width="640" height="76" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><rect x="70" y="511" width="14" height="76" rx="4" fill="#00A8E8" stroke="none" stroke-width="0"/><text x="105" y="558" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="105" dy="0">Adverse operating conditions</tspan></text><rect x="70" y="603" width="640" height="76" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><rect x="70" y="603" width="14" height="76" rx="4" fill="#00A8E8" stroke="none" stroke-width="0"/><text x="105" y="650" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="105" dy="0">Emergency response</tspan></text><text x="70" y="725" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">Required robustness per OSO is set by the SAIL:</tspan></text><text x="70" y="755" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">optional, low, medium or high.</tspan></text><text x="800" y="205" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="2"><tspan x="800" dy="0">ROBUSTNESS = INTEGRITY + ASSURANCE</tspan></text><rect x="800" y="235" width="730" height="104" rx="10" fill="#EF4444" stroke="none" stroke-width="0"/><text x="825" y="277" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="825" dy="0">HIGH</tspan></text><text x="825" y="307" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="825" dy="0">Third-party validation or review,</tspan><tspan x="825" dy="21.25">certification-grade evidence</tspan></text><rect x="800" y="355" width="640" height="104" rx="10" fill="#F59E0B" stroke="none" stroke-width="0"/><text x="825" y="397" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="825" dy="0">MEDIUM</tspan></text><text x="825" y="427" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="825" dy="0">Test results, procedures and</tspan><tspan x="825" dy="21.25">training records an authority can review</tspan></text><rect x="800" y="475" width="550" height="104" rx="10" fill="#10B981" stroke="none" stroke-width="0"/><text x="825" y="517" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="825" dy="0">LOW</tspan></text><text x="825" y="547" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="825" dy="0">Operator declaration with</tspan><tspan x="825" dy="21.25">supporting documents</tspan></text><rect x="800" y="610" width="730" height="160" rx="12" fill="#F1F5F9" stroke="none" stroke-width="0"/><text x="825" y="648" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="825" dy="0">Containment (SORA 2.5): low, medium or high</tspan></text><text x="825" y="684" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="825" dy="0">Depends on maximum speed, environment and the</tspan></text><text x="825" y="710" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="825" dy="0">likelihood of leaving the operational volume.</tspan></text><text x="825" y="745" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="825" dy="0">Evidence: geofence, termination, fail-safes, procedures</tspan></text>
