></text><text x="1460" y="560" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#10B981" text-anchor="middle"><tspan x="1460" dy="0">-2</tspan></text><text x="960" y="640" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="960" dy="0">Final GRC = iGRC + justified credits, never below 1.</tspan></text><text x="960" y="672" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="960" dy="0">SORA also caps the total reduction. Check Step 3.</tspan></text><text x="960" y="722" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="960" dy="0">Each credit needs a claim, an integrity argument</tspan></text><text x="960" y="748" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="960" dy="0">and assurance (how you know it works).</tspan></text>
