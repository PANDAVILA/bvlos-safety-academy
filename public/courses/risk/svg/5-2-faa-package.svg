<text x="70" y="62" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#64748B" text-anchor="start" letter-spacing="2"><tspan x="70" dy="0">BVLOS SAFETY ACADEMY  ·  BVLOS RISK ASSESSMENT AND SAFETY CASE</tspan></text>
<text x="70" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">Building the FAA waiver package</tspan></text>
<rect x="70" y="330" width="330" height="110" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="235.0" y="378.52" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="235.0" dy="0">FAA Aviation</tspan><tspan x="235.0" dy="30.0">Safety Hub</tspan></text><line x1="400" y1="385" x2="470" y2="385" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round"/><line x1="470" y1="246" x2="470" y2="582" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round"/><line x1="470" y1="246" x2="520" y2="246" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round"/><rect x="520" y="200" width="560" height="92" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><text x="545" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="545" dy="0">CONOPS</tspan></text><text x="545" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="545" dy="0">operation, aircraft, procedures, hazards</tspan></text><line x1="470" y1="358" x2="520" y2="358" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round"/><rect x="520" y="312" width="560" height="92" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><text x="545" y="350" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="545" dy="0">Risk analysis</tspan></text><text x="545" y="380" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="545" dy="0">severity and likelihood before and after</tspan></text><line x1="470" y1="470" x2="520" y2="470" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round"/><rect x="520" y="424" width="560" height="92" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><text x="545" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="545" dy="0">WSEGs</tspan></text><text x="545" y="492" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="545" dy="0">answers for each requested waiver</tspan></text><line x1="470" y1="582" x2="520" y2="582" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round"/><rect x="520" y="536" width="560" height="92" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><text x="545" y="574" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="545" dy="0">Mitigation map</tspan></text><text x="545" y="604" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="545" dy="0">each mitigation to its manual section</tspan></text><rect x="1120" y="200" width="410" height="190" rx="12" fill="#FEF3D6" stroke="#F59E0B" stroke-width="2"/><text x="1145" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#B7791F" text-anchor="start"><tspan x="1145" dy="0">Timing (ASHub guide)</tspan></text><text x="1145" y="278" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="1145" dy="0">Start date: at least 90 days</tspan><tspan x="1145" dy="23.400000000000002">after applying</tspan></text><text x="1145" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="1145" dy="0">End date: at most 48 months</tspan><tspan x="1145" dy="23.400000000000002">after the start</tspan></text><text x="70" y="650" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">What the evaluator reviews for BVLOS (§107.31)</tspan></text><circle cx="88" cy="690" r="6" fill="#00A8E8" stroke="none" stroke-width="2"/><text x="110" y="696" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="110" dy="0">Pilot knows UA position, altitude, state</tspan></text><circle cx="88" cy="720" r="6" fill="#00A8E8" stroke="none" stroke-width="2"/><text x="110" y="726" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="110" dy="0">Detect and avoid of aircraft, people, obstacles</tspan></text><circle cx="88" cy="750" r="6" fill="#00A8E8" stroke="none" stroke-width="2"/><text x="110" y="756" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="110" dy="0">Conspicuity and alerts for degraded functions</tspan></text><circle cx="88" cy="780" r="6" fill="#00A8E8" stroke="none" stroke-width="2"/><text x="110" y="786" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="110" dy="0">Crew knowledge, experience and skill</tspan></text><circle cx="88" cy="810" r="6" fill="#00A8E8" stroke="none" stroke-width="2"/><text x="110" y="816" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="110" dy="0">C2 links and their authorizations</tspan></text><rect x="1120" y="420" width="410" height="270" rx="12" fill="#F1F5F9" stroke="none" stroke-width="0"/><text x="1145" y="458" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="1145" dy="0">Proposed Part 108</tspan></text><text x="1145" y="486" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="1145" dy="0">August 2025 proposal</tspan></text><text x="1145" y="524" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="1145" dy="0">Permits: lower-risk operations</tspan><tspan x="1145" dy="22.950000000000003">Certificates: higher risk, with an</tspan><tspan x="1145" dy="22.950000000000003">SMS and a training programme</tspan><tspan x="1145" dy="22.950000000000003">Up to 1,320 lb, generally at or</tspan><tspan x="1145" dy="22.950000000000003">below 400 ft AGL</tspan></text><text x="1145" y="664" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#EF4444" text-anchor="start"><tspan x="1145" dy="0">Not final in Sep 2026. Verify.</tspan></text>
<line x1="70" y1="852" x2="1530" y2="852" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
