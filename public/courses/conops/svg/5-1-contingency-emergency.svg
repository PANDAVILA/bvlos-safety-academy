<text x="70" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">Contingency and emergency procedures</tspan></text>
<rect x="70" y="200" width="470" height="340" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="4"/><rect x="70" y="200" width="470" height="56" rx="14" fill="#10B981" stroke="none" stroke-width="0"/><rect x="70" y="230" width="470" height="26" rx="0" fill="#10B981" stroke="none" stroke-width="2"/><text x="305" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2"><tspan x="305" dy="0">NORMAL</tspan></text><text x="92" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="92" dy="0">Within limits</tspan></text><text x="92" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="92" dy="0">Normal procedures and checklists</tspan></text><rect x="565" y="200" width="470" height="340" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="4"/><rect x="565" y="200" width="470" height="56" rx="14" fill="#F59E0B" stroke="none" stroke-width="0"/><rect x="565" y="230" width="470" height="26" rx="0" fill="#F59E0B" stroke="none" stroke-width="2"/><text x="800" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2"><tspan x="800" dy="0">CONTINGENCY</tspan></text><text x="587" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="587" dy="0">Foreseen abnormal event, handled</tspan><tspan x="587" dy="25.0">inside the contingency volume</tspan></text><text x="587" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="587" dy="0">Aim: return to normal or land safely.</tspan><tspan x="587" dy="23.799999999999997">Examples: degraded C2 link, low battery warning</tspan></text><rect x="1060" y="200" width="470" height="340" rx="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="4"/><rect x="1060" y="200" width="470" height="56" rx="14" fill="#EF4444" stroke="none" stroke-width="0"/><rect x="1060" y="230" width="470" height="26" rx="0" fill="#EF4444" stroke="none" stroke-width="2"/><text x="1295" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2"><tspan x="1295" dy="0">EMERGENCY</tspan></text><text x="1082" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="1082" dy="0">Immediate threat to people or</tspan><tspan x="1082" dy="25.0">property</tspan></text><text x="1082" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="1082" dy="0">Aim: protect people first.</tspan><tspan x="1082" dy="23.799999999999997">Examples: loss of control, fire, collision</tspan></text><text x="70" y="590" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="2"><tspan x="70" dy="0">EVERY PROCEDURE NEEDS</tspan></text><rect x="70" y="615" width="270" height="60" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="205.0" y="652.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="205.0" dy="0">Trigger</tspan></text><rect x="366" y="615" width="270" height="60" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="501.0" y="652.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="501.0" dy="0">First action</tspan></text><rect x="662" y="615" width="270" height="60" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="797.0" y="652.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="797.0" dy="0">Decision owner</tspan></text><rect x="958" y="615" width="270" height="60" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="1093.0" y="652.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1093.0" dy="0">Time limit</tspan></text><rect x="1254" y="615" width="270" height="60" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="1389.0" y="652.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1389.0" dy="0">End state</tspan></text><rect x="70" y="705" width="1460" height="100" rx="12" fill="#F1F5F9" stroke="none" stroke-width="0"/><text x="95" y="740" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="95" dy="0">Reporting</tspan></text><text x="95" y="770" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="95" dy="0">US: NTSB for accidents (49 CFR 830); Part 107 pilots to the FAA within 10 calendar days (§107.9).   EU: 72 hours from becoming aware.</tspan></text><text x="95" y="794" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="95" dy="0">Preserve logs, memory cards and wreckage.</tspan></text>
