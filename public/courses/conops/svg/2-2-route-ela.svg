<path d="M 120 530 C 350 440, 500 620, 760 530 S 1150 460, 1450 540" fill="none" stroke="#0B1F3A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="96" y="511" width="48" height="48" rx="8" fill="#0B1F3A" stroke="none" stroke-width="0"/><text x="120" y="543" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="120" dy="0">L</tspan></text><text x="120" y="589" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle"><tspan x="120" dy="0">Launch</tspan></text><rect x="1426" y="516" width="48" height="48" rx="8" fill="#0B1F3A" stroke="none" stroke-width="0"/><text x="1450" y="548" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1450" dy="0">R</tspan></text><text x="1450" y="594" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle"><tspan x="1450" dy="0">Landing</tspan></text><circle cx="380" cy="590" r="110" fill="#10B981" stroke="#10B981" stroke-width="2" opacity="0.12"/><circle cx="380" cy="590" r="18" fill="#10B981" stroke="none" stroke-width="2"/><text x="380" y="597" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="380" dy="0">E</tspan></text><text x="380" y="730" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#10B981" text-anchor="middle"><tspan x="380" dy="0">ELA 1</tspan></text><circle cx="640" cy="550" r="110" fill="#10B981" stroke="#10B981" stroke-width="2" opacity="0.12"/><circle cx="640" cy="550" r="18" fill="#10B981" stroke="none" stroke-width="2"/><text x="640" y="557" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="640" dy="0">E</tspan></text><text x="640" y="690" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#10B981" text-anchor="middle"><tspan x="640" dy="0">ELA 2</tspan></text><circle cx="900" cy="540" r="110" fill="#10B981" stroke="#10B981" stroke-width="2" opacity="0.12"/><circle cx="900" cy="540" r="18" fill="#10B981" stroke="none" stroke-width="2"/><text x="900" y="547" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="900" dy="0">E</tspan></text><text x="900" y="680" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#10B981" text-anchor="middle"><tspan x="900" dy="0">ELA 3</tspan></text><circle cx="1160" cy="500" r="110" fill="#10B981" stroke="#10B981" stroke-width="2" opacity="0.12"/><circle cx="1160" cy="500" r="18" fill="#10B981" stroke="none" stroke-width="2"/><text x="1160" y="507" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1160" dy="0">E</tspan></text><text x="1160" y="640" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#10B981" text-anchor="middle"><tspan x="1160" dy="0">ELA 4</tspan></text><line x1="380" y1="770" x2="640" y2="770" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" marker-end="url(#aN)"/><line x1="640" y1="770" x2="380" y2="770" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" marker-end="url(#aN)"/><text x="510" y="800" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B1F3A" text-anchor="middle"><tspan x="510" dy="0">ELA spacing 4 km</tspan></text><rect x="70" y="200" width="480" height="150" rx="12" fill="#F1F5F9" stroke="none" stroke-width="0"/><text x="95" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="95" dy="0">Glide check</tspan></text><text x="95" y="272" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="95" dy="0">120 m height x glide ratio 20:1 = 2.4 km</tspan></text><text x="95" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="95" dy="0">ELAs 4 km apart: nearest one is at most 2 km away</tspan></text><text x="95" y="328" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="95" dy="0">42 km corridor needs about 11 sites</tspan></text><rect x="1010" y="200" width="520" height="160" rx="12" fill="#FEF3D6" stroke="#F59E0B" stroke-width="2"/><text x="1035" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7791F" text-anchor="start"><tspan x="1035" dy="0">Route design principles</tspan></text><text x="1035" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="1035" dy="0">• Fewer turns, shorter exposure</tspan></text><text x="1035" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="1035" dy="0">• Obstacle clearance plus margin</tspan></text><text x="1035" y="318" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="1035" dy="0">• A recovery option on every leg</tspan></text><text x="1035" y="342" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="1035" dy="0">• Check the whole volume, not the line</tspan></text><text x="70" y="840" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">Clear height reference: AGL, AMSL and height above take-off are different.</tspan></text>
<line x1="70" y1="852" x2="1530" y2="852" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
