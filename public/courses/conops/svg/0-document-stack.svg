<rect x="0" y="0" width="1600" height="10" rx="0" fill="#0B1F3A" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="160" height="10" rx="0" fill="#F59E0B" stroke="none" stroke-width="2"/>
<text x="70" y="62" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#64748B" text-anchor="start" letter-spacing="2"><tspan x="70" dy="0">BVLOS SAFETY ACADEMY  ·  CONOPS AND OPERATIONS MANUAL FOR BVLOS</tspan></text>
<text x="70" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">The document stack</tspan></text>
<text x="70" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">Three documents describe one operation</tspan></text>
<rect x="200" y="220" width="800" height="140" rx="14" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="4"/><rect x="200" y="220" width="800" height="56" rx="14" fill="#0B1F3A" stroke="none" stroke-width="0"/><rect x="200" y="250" width="800" height="26" rx="0" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="230" y="258" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="2"><tspan x="230" dy="0">CONOPS</tspan></text><text x="230" y="325" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="230" dy="0">What we will do, where, with what, under which limits</tspan></text><rect x="200" y="420" width="800" height="140" rx="14" fill="#FFFFFF" stroke="#00A8E8" stroke-width="4"/><rect x="200" y="420" width="800" height="56" rx="14" fill="#00A8E8" stroke="none" stroke-width="0"/><rect x="200" y="450" width="800" height="26" rx="0" fill="#00A8E8" stroke="none" stroke-width="2"/><text x="230" y="458" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="2"><tspan x="230" dy="0">RISK ASSESSMENT</tspan></text><text x="230" y="525" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="230" dy="0">Why it is acceptably safe: GRC, ARC, SAIL, mitigations</tspan></text><rect x="200" y="620" width="800" height="140" rx="14" fill="#FFFFFF" stroke="#173558" stroke-width="4"/><rect x="200" y="620" width="800" height="56" rx="14" fill="#173558" stroke="none" stroke-width="0"/><rect x="200" y="650" width="800" height="26" rx="0" fill="#173558" stroke="none" stroke-width="2"/><text x="230" y="658" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="2"><tspan x="230" dy="0">OPERATIONS MANUAL</tspan></text><text x="230" y="725" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="230" dy="0">How the crew does it: procedures, limits, roles</tspan></text><line x1="1100" y1="280" x2="1100" y2="650" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" marker-end="url(#aA)"/><line x1="1100" y1="650" x2="1100" y2="280" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" marker-end="url(#aA)"/><text x="1130" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="1130" dy="0">Same facts,</tspan><tspan x="1130" dy="30.0">same numbers</tspan></text><text x="1130" y="500" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="1130" dy="0">Any change in one</tspan><tspan x="1130" dy="25.650000000000002">means a check</tspan><tspan x="1130" dy="25.650000000000002">of the other two</tspan></text><rect x="200" y="790" width="800" height="46" rx="10" fill="#F1F5F9" stroke="none" stroke-width="0"/><text x="230" y="820" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="230" dy="0">Checklists, forms and records sit below the manual and trace back to it.</tspan></text>
<line x1="70" y1="852" x2="1530" y2="852" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
<text x="70" y="880" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#64748B" text-anchor="start" letter-spacing="1.5"><tspan x="70" dy="0">WELCOME  ·  CONOPS AND OPERATIONS MANUAL</tspan></text>
<text x="1530" y="880" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="end"><tspan x="1530" dy="0">Training material. Not approved by any authority.</tspan></text>
