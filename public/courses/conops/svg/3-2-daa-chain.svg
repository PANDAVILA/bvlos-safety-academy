ext><rect x="70" y="363" width="760" height="68" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="84" y="405" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="84" dy="0">ADS-B In or transponder</tspan></text><text x="334" y="405" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#10B981" text-anchor="start"><tspan x="334" dy="0">yes</tspan></text><text x="464" y="405" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#EF4444" text-anchor="start"><tspan x="464" dy="0">no</tspan></text><text x="594" y="405" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="594" dy="0">equipped traffic only</tspan></text><rect x="70" y="441" width="760" height="68" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="84" y="483" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="84" dy="0">Ground-based radar</tspan></text><text x="334" y="483" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#64748B" text-anchor="start"><tspan x="334" dy="0">some</tspan></text><text x="464" y="483" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#10B981" text-anchor="start"><tspan x="464" dy="0">yes</tspan></text><text x="594" y="483" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="594" dy="0">coverage, clutter,</tspan><tspan x="594" dy="17.25">licence</tspan></text><rect x="70" y="519" width="760" height="68" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="84" y="561" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="84" dy="0">Onboard sensors (radar,</tspan><tspan x="84" dy="19.549999999999997">EO/IR)</tspan></text><text x="334" y="561" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#10B981" text-anchor="start"><tspan x="334" dy="0">yes</tspan></text><text x="464" y="561" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#10B981" text-anchor="start"><tspan x="464" dy="0">yes</tspan></text><text x="594" y="561" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="594" dy="0">range, weather, false</tspan><tspan x="594" dy="17.25">alarms</tspan></text><rect x="70" y="597" width="760" height="68" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="84" y="639" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="84" dy="0">Segregated airspace</tspan></text><text x="334" y="639" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#64748B" text-anchor="start"><tspan x="334" dy="0">n/a</tspan></text><text x="464" y="639" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#64748B" text-anchor="start"><tspan x="464" dy="0">n/a</tspan></text><text x="594" y="639" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="594" dy="0">needs authorization</tspan></text><text x="900" y="205" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="2"><tspan x="900" dy="0">THE CHAIN</tspan></text><rect x="900" y="235" width="300" height="50" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="1050.0" y="267.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1050.0" dy="0">Sensor</tspan></text><line x1="1050" y1="285" x2="1050" y2="297" stroke="#00A8E8" stroke-width="3" stroke-linecap="round" marker-end="url(#aC)"/><rect x="900" y="297" width="300" height="50" rx="10" fill="#173558" stroke="none" stroke-width="2"/><text x="1050.0" y="329.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1050.0" dy="0">Alert</tspan></text><line x1="1050" y1="347" x2="1050" y2="359" stroke="#00A8E8" stroke-width="3" stroke-linecap="round" marker-end="url(#aC)"/><rect x="900" y="359" width="300" height="50" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="1050.0" y="391.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1050.0" dy="0">Decision</tspan></text><line x1="1050" y1="409" x2="1050" y2="421" stroke="#00A8E8" stroke-width="3" stroke-linecap="round" marker-end="url(#aC)"/><rect x="900" y="421" width="300" height="50" rx="10" fill="#173558" stroke="none" stroke-width="2"/><text x="1050.0" y="453.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1050.0" dy="0">Command</tspan></text><line x1="1050" y1="471" x2="1050" y2="483" stroke="#00A8E8" stroke-width="3" stroke-linecap="round" marker-end="url(#aC)"/><rect x="900" y="483" width="300" height="50" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="1050.0" y="515.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1050.0" dy="0">Manoeuvre</tspan></text><rect x="1240" y="235" width="290" height="300" rx="12" fill="#FEF3D6" stroke="#F59E0B" stroke-width="2"/><text x="1262" y="272" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7791F" text-anchor="start"><tspan x="1262" dy="0">Validate</tspan></text><text x="1262" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="1262" dy="0">ASTM F3442</tspan><tspan x="1262" dy="22.1">RTCA DO-365</tspan></text><text x="1262" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="1262" dy="0">Lower risk: statement</tspan><tspan x="1262" dy="20.25">and data</tspan><tspan x="1262" dy="20.25">Medium: third party</tspan><tspan x="1262" dy="20.25">plus standard</tspan><tspan x="1262" dy="20.25">High: certification</tspan></text><text x="900" y="590" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="900" dy="0">Observer calculation</tspan></text><text x="900" y="622" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="900" dy="0">30 s at 120 kt = 1 NM</tspan></text><text x="900" y="650" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="900" dy="0">detection 1.5 NM - 1.0 NM = 0.5 NM from observer</tspan></text><text x="70" y="770" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#EF4444" text-anchor="start"><tspan x="70" dy="0">Assess cooperative and non-cooperative traffic separately.</tspan></text>
