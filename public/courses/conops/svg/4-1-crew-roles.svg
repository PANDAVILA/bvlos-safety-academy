<rect x="560" y="190" width="480" height="90" rx="10" fill="#0B1F3A" stroke="none" stroke-width="2"/><text x="800.0" y="231.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="800.0" dy="0">Operations manager / supervisor</tspan></text><text x="800.0" y="257.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.85"><tspan x="800.0" dy="0">plans, approves, holds the limits</tspan></text><rect x="1100" y="190" width="430" height="90" rx="10" fill="#173558" stroke="none" stroke-width="2"/><text x="1315.0" y="231.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1315.0" dy="0">Safety manager</tspan></text><text x="1315.0" y="257.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.85"><tspan x="1315.0" dy="0">audits, investigates, reviews</tspan></text><line x1="800" y1="280" x2="800" y2="330" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/><line x1="1040" y1="235" x2="1100" y2="235" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="560" y="330" width="480" height="90" rx="10" fill="#00A8E8" stroke="none" stroke-width="2"/><text x="800.0" y="371.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="800.0" dy="0">Remote pilot in command</tspan></text><text x="800.0" y="397.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.85"><tspan x="800.0" dy="0">responsible for the flight, can abort</tspan></text><line x1="800" y1="420" x2="800" y2="460" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/><line x1="250" y1="460" x2="1350" y2="460" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/><line x1="250" y1="460" x2="250" y2="500" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/><rect x="100" y="500" width="300" height="90" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="2"/><text x="250.0" y="539.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle"><tspan x="250.0" dy="0">Pilot at control</tspan><tspan x="250.0" dy="25.0">station</tspan></text><line x1="590" y1="460" x2="590" y2="500" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/><rect x="440" y="500" width="300" height="90" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="2"/><text x="590.0" y="539.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle"><tspan x="590.0" dy="0">Payload</tspan><tspan x="590.0" dy="25.0">operator</tspan></text><line x1="1010" y1="460" x2="1010" y2="500" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/><rect x="860" y="500" width="300" height="90" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="2"/><text x="1010.0" y="539.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle"><tspan x="1010.0" dy="0">Visual / airspace</tspan><tspan x="1010.0" dy="25.0">observers</tspan></text><line x1="1350" y1="460" x2="1350" y2="500" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/><rect x="1200" y="500" width="300" height="90" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="2"/><text x="1350.0" y="552.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle"><tspan x="1350.0" dy="0">Ground crew</tspan></text><text x="70" y="235" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">Proposed Part 108</tspan></text><text x="70" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">operations supervisor =</tspan><tspan x="70" dy="20.8">overall safety and training</tspan></text><text x="70" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">flight coordinator =</tspan><tspan x="70" dy="20.8">oversees flights, can intervene</tspan></text><rect x="70" y="640" width="1460" height="150" rx="12" fill="#F1F5F9" stroke="none" stroke-width="0"/><text x="95" y="708" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="95" dy="0">Knowledge</tspan></text><text x="95" y="738" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="95" dy="0">rules, airspace, systems,</tspan><tspan x="95" dy="20.8">ConOps</tspan></text><text x="455" y="708" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="455" dy="0">Skills</tspan></text><text x="455" y="738" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="455" dy="0">normal, abnormal, lost link</tspan></text><text x="815" y="708" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="815" dy="0">Behaviours</tspan></text><text x="815" y="738" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="815" dy="0">CRM, communication, workload</tspan></text><text x="1175" y="708" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="1175" dy="0">Currency</tspan></text><text x="1175" y="738" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="1175" dy="0">recent experience, recurrent</tspan><tspan x="1175" dy="20.8">training</tspan></text><text x="95" y="668" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="2"><tspan x="95" dy="0">COMPETENCE TO DEFINE AND RECORD FOR EACH ROLE</tspan></text>
