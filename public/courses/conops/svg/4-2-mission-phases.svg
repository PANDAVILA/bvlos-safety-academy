t x="800.0" y="395" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="middle"><tspan x="800.0" dy="0">4</tspan></text><polygon points="902.0,230.0 1078.0,230.0 1102.0,290.0 1078.0,350.0 902.0,350.0 926.0,290.0" fill="#0B1F3A" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="1008.0" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1008.0" dy="0">En route</tspan></text><text x="1008.0" y="395" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="middle"><tspan x="1008.0" dy="0">5</tspan></text><polygon points="1110.0,230.0 1286.0,230.0 1310.0,290.0 1286.0,350.0 1110.0,350.0 1134.0,290.0" fill="#173558" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="1216.0" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1216.0" dy="0">Approach</tspan><tspan x="1216.0" dy="20.7">and landing</tspan></text><text x="1216.0" y="395" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="middle"><tspan x="1216.0" dy="0">6</tspan></text><polygon points="1318.0,230.0 1494.0,230.0 1518.0,290.0 1494.0,350.0 1318.0,350.0 1342.0,290.0" fill="#0B1F3A" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="1424.0" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1424.0" dy="0"></tspan><tspan x="1424.0" dy="20.7">Post-flight</tspan></text><text x="1424.0" y="395" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="middle"><tspan x="1424.0" dy="0">7</tspan></text><line x1="688" y1="200" x2="688" y2="640" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 8"/><rect x="568" y="150" width="240" height="44" rx="8" fill="#F59E0B" stroke="none" stroke-width="0"/><text x="688" y="180" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F3A" text-anchor="middle" letter-spacing="2"><tspan x="688" dy="0">GO / NO-GO</tspan></text><rect x="70" y="440" width="650" height="330" rx="12" fill="#F1F5F9" stroke="none" stroke-width="0"/><text x="95" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="95" dy="0">Go/no-go criteria, written as numbers</tspan></text><circle cx="105" cy="512" r="6" fill="#10B981" stroke="none" stroke-width="2"/><text x="125" y="518" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="125" dy="0">Wind and gusts below the aircraft and ELA limits</tspan></text><circle cx="105" cy="545" r="6" fill="#10B981" stroke="none" stroke-width="2"/><text x="125" y="551" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="125" dy="0">Visibility and ceiling above minimum</tspan></text><circle cx="105" cy="578" r="6" fill="#10B981" stroke="none" stroke-width="2"/><text x="125" y="584" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="125" dy="0">C2 link margin above threshold on the test</tspan></text><circle cx="105" cy="611" r="6" fill="#10B981" stroke="none" stroke-width="2"/><text x="125" y="617" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="125" dy="0">Battery or fuel with the required reserve</tspan></text><circle cx="105" cy="644" r="6" fill="#10B981" stroke="none" stroke-width="2"/><text x="125" y="650" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="125" dy="0">Airspace status confirmed</tspan></text><circle cx="105" cy="677" r="6" fill="#10B981" stroke="none" stroke-width="2"/><text x="125" y="683" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="125" dy="0">Crew fit and within duty limits</tspan></text><circle cx="105" cy="710" r="6" fill="#10B981" stroke="none" stroke-width="2"/><text x="125" y="716" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0B1F3A" text-anchor="start"><tspan x="125" dy="0">No unresolved defects</tspan></text><rect x="760" y="440" width="770" height="330" rx="12" fill="#FEF3D6" stroke="#F59E0B" stroke-width="2"/><text x="785" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7791F" text-anchor="start"><tspan x="785" dy="0">Example limits (use your own)</tspan></text><text x="785" y="520" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="785" dy="0">Sustained wind below 10 m/s, gusts below 14 m/s</tspan></text><text x="785" y="552" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="785" dy="0">C2 margin above 15 dB on the test</tspan></text><text x="785" y="584" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#0B1F3A" text-anchor="start"><tspan x="785" dy="0">Battery reserve above 25% at the point of no return</tspan></text><text x="785" y="640" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#EF4444" text-anchor="start"><tspan x="785" dy="0">If any item fails, the answer is no-go.</tspan></text><text x="785" y="676" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="785" dy="0">The remote pilot in command has the authority to say it,</tspan></text><text x="785" y="702" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="785" dy="0">and a way to record it.</tspan></text>
