"0">COORDINATION OPTIONS</tspan></text><rect x="900" y="230" width="630" height="80" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><text x="925" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="925" dy="0">Air traffic service coordination</tspan></text><text x="925" y="292" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="925" dy="0">required in controlled airspace, useful near airfields</tspan></text><rect x="900" y="324" width="630" height="80" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><text x="925" y="358" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="925" dy="0">NOTAM or equivalent</tspan></text><text x="925" y="386" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="925" dy="0">informs other users, does not separate traffic</tspan></text><rect x="900" y="418" width="630" height="80" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><text x="925" y="452" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="925" dy="0">Letters of agreement</tspan></text><text x="925" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="925" dy="0">airfields, military units, other airspace users</tspan></text><rect x="900" y="512" width="630" height="80" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><text x="925" y="546" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="925" dy="0">Segregated airspace</tspan></text><text x="925" y="574" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="925" dy="0">temporary restricted or segregated area</tspan></text><rect x="900" y="606" width="630" height="80" rx="10" fill="#FFFFFF" stroke="#00A8E8" stroke-width="3"/><text x="925" y="640" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="925" dy="0">Outreach</tspan></text><text x="925" y="668" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="925" dy="0">flying clubs, helicopter operators, farmers</tspan></text><text x="70" y="760" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">Remote ID, anti-collision lighting and electronic conspicuity help others see you.</tspan></text><text x="70" y="790" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">Rules differ by country. Confirm with the competent authority.</tspan></text>
