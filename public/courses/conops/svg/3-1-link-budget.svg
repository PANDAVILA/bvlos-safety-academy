ext x="755.0" y="790" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B1F3A" text-anchor="middle"><tspan x="755.0" dy="0">Other</tspan><tspan x="755.0" dy="19.2">losses</tspan></text><rect x="870" y="622.1333333333333" width="150" height="117.86666666666667" rx="8" fill="#F59E0B" stroke="none" stroke-width="0"/><text x="945.0" y="608.1333333333333" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="middle"><tspan x="945.0" dy="0">-76 dBm</tspan></text><text x="945.0" y="790" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B1F3A" text-anchor="middle"><tspan x="945.0" dy="0">Received</tspan></text><line x1="90" y1="358.66666666666663" x2="1060" y2="358.66666666666663" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/><text x="1060" y="350.66666666666663" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="end"><tspan x="1060" dy="0">0 dBm</tspan></text><line x1="90" y1="688.0" x2="1060" y2="688.0" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><text x="100" y="678.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#EF4444" text-anchor="start"><tspan x="100" dy="0">receiver sensitivity -95 dBm</tspan></text><line x1="1050" y1="622.1333333333333" x2="1050" y2="688.0" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" marker-end="url(#aN)"/><line x1="1050" y1="688.0" x2="1050" y2="622.1333333333333" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" marker-end="url(#aN)"/><text x="1062" y="659.3333333333334" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="1062" dy="0">19 dB</tspan></text><rect x="1130" y="200" width="400" height="300" rx="12" fill="#F1F5F9" stroke="none" stroke-width="0"/><text x="1155" y="240" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="1155" dy="0">Fade margin</tspan></text><text x="1155" y="290" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#10B981" text-anchor="start"><tspan x="1155" dy="0">-76 - (-95) = 19 dB</tspan></text><text x="1155" y="330" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="1155" dy="0">Many designers look for 10 to</tspan><tspan x="1155" dy="22.950000000000003">20 dB or more. Define and</tspan><tspan x="1155" dy="22.950000000000003">justify your own criterion.</tspan></text><rect x="1130" y="520" width="400" height="250" rx="12" fill="#FEF3D6" stroke="#F59E0B" stroke-width="2"/><text x="1155" y="558" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7791F" text-anchor="start"><tspan x="1155" dy="0">Free-space path loss</tspan></text><text x="1155" y="596" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="1155" dy="0">FSPL = 20 log10(d km)</tspan></text><text x="1155" y="624" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="1155" dy="0">         + 20 log10(f MHz)</tspan></text><text x="1155" y="652" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="1155" dy="0">         + 32.44</tspan></text><text x="1155" y="700" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="1155" dy="0">5 km, 2,400 MHz: 14.0 + 67.6 + 32.4 = 114 dB</tspan></text>
