tspan></text><text x="570" y="443" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="570" dy="0">Risk assessment:</tspan></text><text x="750" y="443" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="750" dy="0">Volume top: 120 m AGL</tspan></text><text x="570" y="481" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="570" dy="0">Manual:</tspan></text><text x="750" y="481" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="750" dy="0">Ceiling: 120 m AGL</tspan></text><text x="70" y="700" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start"><tspan x="70" dy="0">When one changes, check the other two.</tspan></text><text x="70" y="735" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">Add a column to each mitigation in the risk assessment: where is it implemented in the manual?</tspan></text><text x="70" y="775" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">Review the manual after every occurrence, every aircraft or software change and at least annually.</tspan></text>
