an x="800" dy="0">Operational volume</tspan></text><line x1="770" y1="640" x2="830" y2="640" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/><line x1="770" y1="632" x2="770" y2="648" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/><line x1="830" y1="632" x2="830" y2="648" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/><text x="800.0" y="670" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F3A" text-anchor="middle"><tspan x="800.0" dy="0">FG 30 m</tspan></text><line x1="830" y1="640" x2="980" y2="640" stroke="#B7791F" stroke-width="3" stroke-linecap="round"/><line x1="830" y1="632" x2="830" y2="648" stroke="#B7791F" stroke-width="3" stroke-linecap="round"/><line x1="980" y1="632" x2="980" y2="648" stroke="#B7791F" stroke-width="3" stroke-linecap="round"/><text x="905.0" y="670" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B7791F" text-anchor="middle"><tspan x="905.0" dy="0">CV 150 m</tspan></text><line x1="980" y1="640" x2="1100" y2="640" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/><line x1="980" y1="632" x2="980" y2="648" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/><line x1="1100" y1="632" x2="1100" y2="648" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/><text x="1040.0" y="670" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#EF4444" text-anchor="middle"><tspan x="1040.0" dy="0">GRB 120 m</tspan></text><line x1="800" y1="445" x2="800" y2="550" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><text x="814" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="814" dy="0">centre line</tspan></text><line x1="500" y1="720" x2="1100" y2="720" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round" marker-end="url(#aN)"/><line x1="1100" y1="720" x2="500" y2="720" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round" marker-end="url(#aN)"/><text x="800" y="760" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="middle"><tspan x="800" dy="0">Footprint = 2 x (30 + 150 + 120) = 600 m</tspan></text><text x="1130" y="330" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1F3A" text-anchor="start"><tspan x="1130" dy="0">Heights:</tspan><tspan x="1130" dy="23.400000000000002">120 m AGL</tspan></text><text x="70" y="330" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">FG = route + navigation error</tspan><tspan x="70" dy="23.799999999999997">and corridor tolerance</tspan></text><text x="70" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">CV = speed x reaction time</tspan><tspan x="70" dy="23.799999999999997">25 m/s x 6 s = 150 m</tspan></text><text x="70" y="470" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#64748B" text-anchor="start"><tspan x="70" dy="0">GRB: start from 1:1 height to</tspan><tspan x="70" dy="23.799999999999997">distance, then adjust</tspan></text>
